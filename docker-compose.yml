version: '2.4'

services:
  stockpilot-db:
    image: postgres:16-alpine
    container_name: stockpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpilotdb
      POSTGRES_USER: stockpilot_user
      POSTGRES_PASSWORD: stockpilot_pass
    ports:
      - "5434:5432"
    volumes:
      - stockpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot_user -d stockpilotdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  stockpilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpilot_app
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://stockpilot-db:5432/stockpilotdb
      DB_USERNAME: stockpilot_user
      DB_PASSWORD: stockpilot_pass
    depends_on:
      stockpilot-db:
        condition: service_healthy

volumes:
  stockpilot_pgdata:
