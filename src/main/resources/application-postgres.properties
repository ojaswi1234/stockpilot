# PostgreSQL Database Configuration (Docker Compose, CI, and Production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockpilotdb}
spring.datasource.username=${DB_USERNAME:stockpilot_user}
spring.datasource.password=${DB_PASSWORD:stockpilot_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
