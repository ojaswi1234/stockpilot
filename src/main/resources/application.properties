spring.application.name=stockpilot
server.port=${PORT:8083}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockpilotdb}
spring.datasource.username=${DB_USERNAME:stockpilot_user}
spring.datasource.password=${DB_PASSWORD:stockpilot_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.stockpilot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
