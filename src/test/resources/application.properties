spring.application.name=stockpilot-test

# H2 in-memory DB for local tests
spring.datasource.url=jdbc:h2:mem:stockpilotdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway during unit/integration tests and let Hibernate ddl-auto manage schema in test H2
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# HikariCP pool for concurrent tests
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

logging.level.com.stockpilot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

